interface:
  display_name: "任务开发"
  short_description: "基于任务分解文档按依赖和编号顺序逐个 task 开发，验证 DoD 后输出总结并更新文档"
  default_prompt: "Use $us-task-dev. Read the task breakdown document I specify, lock exactly one task, and implement only that task. If I indicate a task, verify its dependencies are complete before coding; otherwise choose the first unfinished task whose dependencies are complete by task number order. Do not start or modify later tasks before the locked task has implementation, DoD verification, checklist updates, and summary written. Default task breakdown path: ./<变更描述>-任务分解.md"
